[package]
name = "txcript-share-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Object store and catalog seams for txcript's shared transcript service."
license = "Apache-2.0"
publish = false

[dependencies]
# Only the sans-IO core, for `Key`/`KeyPrefix`/`Precondition`. No S3 client,
# no HTTP, no async runtime: the real backends are hosts' business, and this
# crate defines the shape they must fit.
txcript-share-core = { path = "../share-core" }
# For the shared metadata projection: both writers derive a listing's
# attributes from a Simple document, and they must agree.
serde_json = "1.0.150"

# S3 is optional so a Filesystem-only deployment does not compile, ship, or
# audit the AWS client tree. The codec-free core and the other backends stay
# dependency-light either way.
[features]
default = []
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-smithy-types"]

[dependencies.aws-config]
version = "1.8"
optional = true
default-features = false
features = ["behavior-version-latest", "rt-tokio", "rustls"]

[dependencies.aws-sdk-s3]
version = "1.123"
optional = true
default-features = false
features = ["behavior-version-latest", "rt-tokio", "rustls"]

[dependencies.aws-smithy-types]
version = "1.3"
optional = true

[dev-dependencies]
# A runtime, only to drive the conformance suite. Current-thread is enough
# and matches the Worker's execution model.
tokio = { version = "1.52.3", default-features = false, features = ["rt", "macros"] }
tempfile = "3.27.0"

[lints]
workspace = true