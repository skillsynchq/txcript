[package]
name = "txcript-share-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Sans-IO authorization core for txcript's shared transcript service."
license = "Apache-2.0"
# Not published: this is the service's internal core, not part of the
# txcript library's public surface.
publish = false

# Deliberately empty. This crate performs no I/O, has no async runtime, and
# reaches no network — that is the property that lets the same rules run in a
# Cloudflare Worker (wasm32) and in a native host, and lets the whole access
# matrix be tested as a pure function.
[dependencies]

[dev-dependencies]
proptest = "1.11.0"

[lints]
workspace = true
